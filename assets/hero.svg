<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 130" width="160" height="130" role="img" aria-label="Animated heartbeat">
  <defs>
    <linearGradient id="ecg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bff3ec"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke="#ffffff" stroke-width="3" opacity="0.55" stroke-linecap="round">
    <circle cx="80" cy="65" r="30">
      <animate attributeName="r" values="28;41;28" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0.15;0.6" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>
  <path d="M14 65 H52 l9 -26 l13 50 l11 -38 l7 16 H146"
        fill="none" stroke="url(#ecg)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
        stroke-dasharray="340" stroke-dashoffset="340">
    <animate attributeName="stroke-dashoffset" values="340;0;0" keyTimes="0;0.7;1" dur="2.6s" repeatCount="indefinite"/>
  </path>
  <path d="M80 57 c-5 -9 -19 -3 -19 6 c0 8 14 14 19 18 c5 -4 19 -10 19 -18 c0 -9 -14 -15 -19 -6 z"
        fill="#ffffff" opacity="0.92">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.6s" repeatCount="indefinite"/>
  </path>
</svg>
